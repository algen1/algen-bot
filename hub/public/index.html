<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algen Bot</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Algen Bot">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#000;--side:#0d0d0d;--card:#1b1b1b;--card2:#232323;--hover:#1a1a1a;--line:#202020;--line2:#2c2c2c;
  --text:#ededed;--muted:#8d8d8d;--faint:#5c5c5c;--accent:#fff;--accent-ink:#000;--err:#ff6b6b;--ok:#35d07f;--warn:#f0b445;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="light"]{--bg:#fff;--side:#f6f6f6;--card:#efefef;--card2:#e6e6e6;--hover:#ececec;--line:#e4e4e4;--line2:#d8d8d8;--text:#111;--muted:#6a6a6a;--faint:#a3a3a3;--accent:#000;--accent-ink:#fff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
.app{display:grid;grid-template-columns:390px minmax(0,1fr);height:100dvh}

/* ---------- sidebar ---------- */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;justify-content:flex-end;gap:8px;padding:14px 14px 4px}
.circle{width:36px;height:36px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--text)}
.circle:hover{background:var(--card2)}
.search{margin:6px 14px 4px;display:none}
.search.open{display:block}
.search input{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:9px 13px;outline:0}
.scroll{flex:1;overflow:auto;padding:4px 10px 12px}

.pins{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.pins::-webkit-scrollbar{display:none}
.pin{flex:none;width:88px;padding:10px 4px 8px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:7px}
.pin:hover{background:var(--hover)}
.pin.on{background:var(--card)}
.pin .nm{font-size:13px;max-width:82px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}

/* Algen Bot avatar: colored orb with two "spark" eyes (own design) */
.orb{position:relative;border-radius:50%;flex:none;background:var(--c);
  background-image:radial-gradient(circle at 32% 28%,rgba(255,255,255,.45),rgba(255,255,255,0) 46%),radial-gradient(circle at 70% 85%,rgba(0,0,0,.25),rgba(0,0,0,0) 55%)}
.orb::before,.orb::after{content:"";position:absolute;top:38%;width:13%;height:22%;border-radius:40%;background:#111}
.orb::before{left:33%}.orb::after{left:55%}
.orb.lg{width:56px;height:56px}.orb.md{width:36px;height:36px}.orb.sm{width:22px;height:22px}
.orb .badge{position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--side);background:var(--faint)}
.orb.md .badge{width:11px;height:11px;border-width:2px}
.badge.working{background:var(--ok);animation:pulse 1.3s infinite}.badge.queued{background:var(--warn)}.badge.idle{display:none}.badge.off{background:var(--err)}
@keyframes pulse{50%{opacity:.35}}

.grp-label{padding:8px 10px 6px;color:var(--muted);font-size:13.5px}
.grp{display:flex;align-items:center;width:100%;padding:9px 10px;border-radius:10px;color:var(--muted);font-size:13.5px;margin-top:4px}
.grp:hover{background:var(--hover)}
.grp.closed{background:var(--card)}
.grp .ct{margin-left:auto;font-size:13px}
.grp svg{margin-left:10px;transition:transform .15s}
.grp:not(.closed) svg{transform:rotate(90deg)}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:9px 10px;border-radius:12px;text-align:left}
.row:hover{background:var(--hover)}
.row.on{background:var(--card)}
.row .t{min-width:0;flex:1}
.row .nm{font-weight:560;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.me{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.me .ini{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:13px;color:var(--muted);font-weight:600}
.me .nm{flex:1;font-weight:520}

/* ---------- chat ---------- */
.main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{position:absolute;top:0;right:0;left:0;padding:12px 16px 22px;background:linear-gradient(var(--bg) 55%,transparent);display:flex;justify-content:flex-end;align-items:center;gap:8px;z-index:5;pointer-events:none}
.topbar>*{pointer-events:auto}
.menu-btn{display:none;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:5px 14px 5px 6px;font-weight:540;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.chip:hover{background:var(--card2)}
.chip .st{color:var(--muted);font-weight:450;font-size:13px}
.feed{flex:1;overflow:auto;padding:70px 0 16px}
.feed-in{max-width:820px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;gap:14px}
.m-user{align-self:flex-end;background:var(--c);color:#fff;padding:7px 15px;border-radius:20px;max-width:78%;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.m-agent{align-self:flex-start;background:var(--card);border-radius:14px;padding:12px 16px;max-width:92%;word-wrap:break-word}
.m-agent p{margin:0 0 .65em}.m-agent p:last-child{margin:0}
.m-agent ul,.m-agent ol{padding-left:1.25em;margin:.2em 0 .65em}.m-agent li{margin:.2em 0}
.m-agent pre{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:11px 13px;overflow:auto;font:13px/1.5 var(--mono);margin:.5em 0}
.m-agent code{font:13px var(--mono);background:var(--card2);padding:1px 6px;border-radius:6px}.m-agent pre code{background:none;padding:0}
.m-agent a{color:var(--text);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.m-steps{align-self:center;color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.m-steps button{color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.m-steps button:hover{color:var(--text)}
.m-steps ol{list-style:none;padding:8px 12px;background:var(--side);border:1px solid var(--line);border-radius:12px;max-width:560px;font:12.5px/1.6 var(--mono);color:var(--muted);display:none}
.m-steps.open ol{display:block}
.m-steps li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-sys{align-self:center;color:var(--faint);font-size:12.5px;text-align:center}
.m-err{align-self:flex-start;color:var(--err);font:13px/1.5 var(--mono);border:1px solid #ff6b6b44;border-radius:12px;padding:10px 14px;white-space:pre-wrap;max-width:92%}
.working{align-self:flex-start;color:var(--muted);font-size:14px;display:flex;gap:10px;align-items:center;padding-left:4px}
.shimmer{background:linear-gradient(90deg,var(--faint),var(--text),var(--faint));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{margin:14vh auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 20px}
.empty h1{font-size:26px;font-weight:620;letter-spacing:-.015em}
.empty p{color:var(--muted);max-width:460px}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:10px;width:min(520px,100%)}
.sugg button{background:var(--card);border-radius:12px;padding:11px 15px;text-align:left;color:var(--muted);font-size:14px}
.sugg button:hover{background:var(--card2);color:var(--text)}

.composer{padding:8px 28px calc(18px + env(safe-area-inset-bottom))}
.box{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:6px;border:1px solid var(--line2);border-radius:26px;padding:6px 6px 6px 8px;background:var(--bg)}
.box:focus-within{border-color:#444}
.plus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.plus:hover{background:var(--hover);color:var(--text)}
.box textarea{flex:1;background:none;border:0;outline:0;resize:none;padding:6px 4px;min-height:34px;max-height:200px;line-height:1.45}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:0;pointer-events:none}
.stop{width:34px;height:34px;border-radius:50%;background:var(--card2);display:none;place-items:center;flex:none}
.stop.show{display:grid}
.popmenu{position:absolute;bottom:72px;left:36px;background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:6px;display:none;min-width:220px;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.popmenu.open{display:block}
.popmenu button{display:flex;width:100%;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left}
.popmenu button:hover{background:var(--card2)}

/* ---------- computer drawer ---------- */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(62vw,1100px);background:var(--side);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .22s ease;z-index:30;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer-top .t{flex:1;font-weight:560}
.drawer-top a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line2);border-radius:999px;padding:5px 12px}
.drawer-top a:hover{color:var(--text)}
.frame{flex:1;position:relative;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.frame .help{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#888;font-size:13.5px}

/* ---------- modal & login ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:50;padding:16px}
.scrim.open{display:grid}
.modal{background:var(--side);border:1px solid var(--line2);border-radius:20px;width:min(440px,100%);padding:22px;max-height:90dvh;overflow:auto}
.modal-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.modal h2{font-size:18px;font-weight:620}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;outline:0}
.field input:focus,.field textarea:focus{border-color:#555}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);outline-offset:3px}
.sw.on{outline:2px solid var(--text)}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:14px}
.btns{display:flex;justify-content:flex-end;gap:8px}
.btn{border-radius:999px;padding:8px 16px;font-size:14px;font-weight:550;background:var(--card)}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.del{color:var(--err);margin-right:auto}
.err{color:var(--err);font-size:13px;min-height:18px;margin-bottom:6px}
.login{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:60;padding:16px}
.login.open{display:grid}
.login form{width:min(340px,100%);display:flex;flex-direction:column;align-items:center;gap:12px}
.login h1{font-size:22px;font-weight:620;margin:6px 0 10px}
.login input{width:100%;background:var(--side);border:1px solid var(--line2);border-radius:999px;padding:12px 18px;outline:0;text-align:center}
.login button{width:100%;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:12px;font-weight:600}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .menu-btn{display:grid}
  .feed-in{padding:0 14px}
  .composer{padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
  .drawer{width:100vw}
  .popmenu{left:16px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="circle menu-close" id="sideClose" style="margin-right:auto;display:none" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="circle" id="searchBtn" aria-label="Search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
      <button class="circle" id="newAgent" aria-label="New agent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="search" id="searchWrap"><input id="search" placeholder="Search agents"></div>
    <div class="scroll">
      <div class="pins" id="pins"></div>
      <div id="list"></div>
    </div>
    <div class="me">
      <div class="ini" id="meIni">AR</div><div class="nm" id="meName"></div>
      <button class="circle" id="themeBtn" title="Light / dark" aria-label="Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17z" fill="currentColor"/></svg></button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="circle menu-btn" id="menuBtn" aria-label="Agents"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <button class="circle" id="screenBtn" title="Watch its computer" aria-label="Computer"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12.5" rx="2"/><path d="M8.5 20.5h7M12 16.5v4"/></svg></button>
      <button class="chip" id="chip"><span class="orb sm" id="chipOrb"></span><span id="chipName"></span><span class="st" id="chipSt"></span></button>
    </div>
    <div class="feed" id="feed"><div class="feed-in" id="feedIn"></div></div>
    <div class="composer">
      <div class="popmenu" id="pop">
        <button id="popScreen">🖥️ Watch its computer</button>
        <button id="popNew">✨ New conversation</button>
        <button id="popEdit">✏️ Edit agent</button>
      </div>
      <div class="box">
        <button class="plus" id="plus" aria-label="More"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <textarea id="input" rows="1" placeholder="Message Atlas"></textarea>
        <button class="stop" id="stop" title="Stop" aria-label="Stop"><svg width="12" height="12" viewBox="0 0 12 12"><rect width="12" height="12" rx="2" fill="currentColor"/></svg></button>
        <button class="send" id="send" disabled aria-label="Send"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </main>
</div>

<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <span class="orb sm" id="drOrb"></span><span class="t" id="drTitle">Computer</span>
    <a id="drOpen" target="_blank" rel="noopener">Open in new tab</a>
    <button class="circle" id="drClose" aria-label="Close"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="frame"><div class="help">If this stays blank, tap “Open in new tab” once, accept the security warning, then come back.</div><iframe id="drFrame" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div>
</aside>

<div class="scrim" id="modal">
  <form class="modal" id="form">
    <div class="modal-head"><span class="orb lg" id="mOrb"></span><h2 id="mTitle">New agent</h2></div>
    <label class="field"><span>Name</span><input id="fName" maxlength="40" placeholder="e.g. SEO Agent" required></label>
    <label class="field"><span>What does it do?</span><textarea id="fRole" rows="3" maxlength="400" placeholder="e.g. Looks after my website's Google rankings"></textarea></label>
    <label class="field"><span>Group</span><input id="fGroup" maxlength="40" list="groups" placeholder="e.g. Personal Life (optional)"><datalist id="groups"></datalist></label>
    <div class="field"><span>Color</span><div class="swatches" id="swatches"></div></div>
    <label class="check"><input type="checkbox" id="fPin"> Pin to the top</label>
    <div class="err" id="fErr"></div>
    <div class="btns"><button type="button" class="btn del" id="fDel" style="display:none">Delete</button><button type="button" class="btn" id="fCancel">Cancel</button><button class="btn pri" id="fSave">Create</button></div>
  </form>
</div>

<div class="login" id="login">
  <form id="loginForm">
    <span class="orb lg" style="--c:#ff3d8b"></span>
    <h1>Algen Bot</h1>
    <input type="password" id="pw" placeholder="Password" autocomplete="current-password">
    <div class="err" id="pwErr"></div>
    <button>Continue</button>
  </form>
</div>

<script>
const $ = (id) => document.getElementById(id);
const COLORS = ['#ff3d8b', '#ff9a1f', '#2fcf6f', '#ff4d4d', '#3d8bff', '#9b5cff', '#c88a4a', '#f2f2f2', '#8a8a8a'];
let agents = [], current = null, messages = {}, me = 'You', query = '';
let closed = {}; try { closed = JSON.parse(localStorage.getItem('ab-closed') || '{}'); } catch {}
try { const t = localStorage.getItem('ab-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

async function api(path, opts = {}) {
  const r = await fetch('/api' + path, { headers: { 'Content-Type': 'application/json' }, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401 && path !== '/login') { $('login').classList.add('open'); $('pw').focus(); throw new Error('login'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function md(src) {
  const blocks = [];
  let s = esc(src).replace(/```\w*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(`<pre><code>${c}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.split(/\n{2,}/).map((p) => {
    const t = p.trim(); if (/^\u0000\d+\u0000$/.test(t)) return t;
    const ls = t.split('\n');
    if (ls.every((l) => /^\s*[-*•] /.test(l))) return '<ul>' + ls.map((l) => `<li>${l.replace(/^\s*[-*•] /, '')}</li>`).join('') + '</ul>';
    if (ls.every((l) => /^\s*\d+[.)] /.test(l))) return '<ol>' + ls.map((l) => `<li>${l.replace(/^\s*\d+[.)] /, '')}</li>`).join('') + '</ol>';
    return `<p>${t.replace(/^#{1,6} (.*)$/gm, '<strong>$1</strong>').replace(/\n/g, '<br>')}</p>`;
  }).join('').replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[i]);
}
const badge = (a) => a.computer !== 'running' ? 'off' : a.status;
const orb = (a, size) => `<span class="orb ${size}" style="--c:${a.color}"><span class="badge ${badge(a)}"></span></span>`;
const stText = (a) => a.computer !== 'running' ? 'Computer offline' : a.status === 'working' ? 'Working…' : a.status === 'queued' ? 'Waiting its turn' : '';
const preview = (a) => stText(a) || (a.last ? (a.last.role === 'user' ? 'You: ' : '') + a.last.text.replace(/\s+/g, ' ') : a.role);

function renderSide() {
  const vis = agents.filter((a) => !query || (a.name + ' ' + a.role + ' ' + a.group).toLowerCase().includes(query));
  $('pins').innerHTML = vis.filter((a) => a.pinned).map((a) => `<button class="pin${a.id === current ? ' on' : ''}" data-id="${a.id}">${orb(a, 'lg')}<span class="nm">${esc(a.name)}</span></button>`).join('');
  $('pins').style.display = $('pins').innerHTML ? '' : 'none';
  const row = (a) => `<button class="row${a.id === current ? ' on' : ''}" data-id="${a.id}">${orb(a, 'md')}<span class="t"><div class="nm">${esc(a.name)}</div><div class="pv">${esc(preview(a))}</div></span></button>`;
  const loose = vis.filter((a) => !a.group && !a.pinned);
  const groups = [...new Set(vis.filter((a) => a.group).map((a) => a.group))];
  let h = loose.length ? `<div class="grp-label">Agents</div>` + loose.map(row).join('') : '';
  for (const g of groups) {
    const items = vis.filter((a) => a.group === g);
    const isClosed = closed[g] && !query;
    h += `<button class="grp${isClosed ? ' closed' : ''}" data-g="${esc(g)}"><span>${esc(g)}</span><span class="ct">${isClosed ? items.length : ''}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg></button>`;
    if (!isClosed) h += items.map(row).join('');
  }
  $('list').innerHTML = h;
  document.querySelectorAll('[data-id]').forEach((b) => (b.onclick = () => { select(b.dataset.id); $('side').classList.remove('open'); }));
  document.querySelectorAll('[data-g]').forEach((b) => (b.onclick = () => { closed[b.dataset.g] = !closed[b.dataset.g]; try { localStorage.setItem('ab-closed', JSON.stringify(closed)); } catch {} renderSide(); }));
  $('groups').innerHTML = [...new Set(agents.map((a) => a.group).filter(Boolean))].map((g) => `<option value="${esc(g)}">`).join('');
  $('meName').textContent = me; $('meIni').textContent = me.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();

  const a = cur(); if (!a) return;
  $('chipOrb').style.setProperty('--c', a.color); $('drOrb').style.setProperty('--c', a.color);
  $('chipName').textContent = a.name; $('chipSt').textContent = stText(a);
  $('input').placeholder = `Message ${a.name}`;
  $('stop').classList.toggle('show', a.status !== 'idle');
  $('drTitle').textContent = `${a.name}'s computer`;
  document.documentElement.style.setProperty('--agent', a.color);
}
const cur = () => agents.find((x) => x.id === current);

function renderFeed() {
  const a = cur(), list = messages[current] || [], f = $('feedIn');
  if (!a) { f.innerHTML = ''; return; }
  if (!list.length) {
    f.innerHTML = `<div class="empty"><span class="orb lg" style="--c:${a.color}"></span><h1>${esc(a.name)}</h1><p>${esc(a.role)}</p><div class="sugg">${
      ['Open Hacker News and summarise the top 5 posts', 'Research the best budget mechanical keyboards and make a shortlist', 'Write a Python script that renames photos by date'].map((t) => `<button>${esc(t)}</button>`).join('')}</div></div>`;
    f.querySelectorAll('.sugg button').forEach((b) => (b.onclick = () => { $('input').value = b.textContent; onInput(); $('input').focus(); }));
    return;
  }
  let h = '', steps = [];
  const flush = () => {
    if (!steps.length) return;
    h += `<div class="m-steps"><button onclick="this.parentNode.classList.toggle('open')">Used its computer · ${steps.length} step${steps.length > 1 ? 's' : ''} <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button><ol>${steps.map((s) => `<li title="${esc(s)}">${esc(s)}</li>`).join('')}</ol></div>`;
    steps = [];
  };
  for (const m of list) {
    if (m.role === 'tool') { steps.push(m.text); continue; }
    flush();
    if (m.role === 'user') h += `<div class="m-user" style="--c:${a.color}">${esc(m.text)}</div>`;
    else if (m.role === 'agent') h += `<div class="m-agent">${md(m.text)}</div>`;
    else if (m.role === 'error') h += `<div class="m-err">${esc(m.text)}</div>`;
    else h += `<div class="m-sys">${esc(m.text)}</div>`;
  }
  flush();
  if (a.status !== 'idle') h += `<div class="working"><span class="shimmer">${a.status === 'queued' ? 'Waiting for its turn…' : 'Working on its computer…'}</span></div>`;
  const open = [...f.querySelectorAll('.m-steps')].map((e) => e.classList.contains('open'));
  f.innerHTML = h;
  f.querySelectorAll('.m-steps').forEach((e, i) => open[i] && e.classList.add('open'));
  const feed = $('feed'); feed.scrollTop = feed.scrollHeight;
}

async function select(id) {
  current = id; try { localStorage.setItem('ab-agent', id); } catch {}
  renderSide();
  if (!messages[id]) messages[id] = await api(`/agents/${id}/messages`);
  renderFeed();
  if ($('drawer').classList.contains('open')) loadScreen();
}
function loadScreen() {
  const a = cur(); if (!a) return;
  const url = `https://${location.hostname}:${a.port}/`;
  $('drOpen').href = url;
  if ($('drFrame').dataset.src !== url) { $('drFrame').src = url; $('drFrame').dataset.src = url; }
}
async function refresh() {
  const r = await api('/agents'); agents = r.agents; me = r.user || me;
  if (!cur()) { let s = null; try { s = localStorage.getItem('ab-agent'); } catch {} current = agents.find((a) => a.id === s) ? s : agents[0]?.id; }
  renderSide();
}
function connect() {
  const es = new EventSource('/api/events');
  es.onmessage = (e) => {
    const ev = JSON.parse(e.data), a = agents.find((x) => x.id === ev.agent);
    if (ev.type === 'message') {
      if (messages[ev.agent]) messages[ev.agent].push(ev.msg);
      if (a && (ev.msg.role === 'agent' || ev.msg.role === 'user')) a.last = { role: ev.msg.role, text: ev.msg.text.slice(0, 160) };
      if (ev.agent === current) renderFeed();
      renderSide();
    } else if (ev.type === 'status' && a) { a.status = ev.status; renderSide(); if (ev.agent === current) renderFeed(); }
  };
  es.onerror = () => { es.close(); setTimeout(() => refresh().then(connect).catch(() => {}), 3000); };
}

function onInput() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 200) + 'px'; $('send').disabled = !t.value.trim(); }
async function send() {
  const text = $('input').value.trim(); if (!text || !current) return;
  $('input').value = ''; onInput();
  try { await api(`/agents/${current}/messages`, { method: 'POST', body: { text } }); } catch (e) { if (e.message !== 'login') alert(e.message); }
}
$('input').addEventListener('input', onInput);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
$('send').onclick = send;
$('stop').onclick = () => api(`/agents/${current}/stop`, { method: 'POST' });
const openDrawer = () => { $('drawer').classList.add('open'); loadScreen(); };
$('screenBtn').onclick = openDrawer; $('drClose').onclick = () => $('drawer').classList.remove('open');
$('chip').onclick = () => openModal(cur());
$('plus').onclick = (e) => { e.stopPropagation(); $('pop').classList.toggle('open'); };
document.addEventListener('click', () => $('pop').classList.remove('open'));
$('popScreen').onclick = openDrawer;
$('popEdit').onclick = () => openModal(cur());
$('popNew').onclick = () => { if (confirm('Start a new conversation? It forgets this chat, but its files stay.')) api(`/agents/${current}/new-chat`, { method: 'POST' }); };
$('menuBtn').onclick = () => $('side').classList.add('open');
$('sideClose').onclick = () => $('side').classList.remove('open');
if (matchMedia('(max-width:820px)').matches) $('sideClose').style.display = 'grid';
$('searchBtn').onclick = () => { $('searchWrap').classList.toggle('open'); $('search').focus(); };
$('search').oninput = () => { query = $('search').value.trim().toLowerCase(); renderSide(); };
$('themeBtn').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; try { localStorage.setItem('ab-theme', t); } catch {} };

let editing = null, pick = COLORS[0];
function renderSwatches() {
  $('swatches').innerHTML = COLORS.map((c) => `<button type="button" class="sw${c === pick ? ' on' : ''}" style="--c:${c}" data-c="${c}" aria-label="${c}"></button>`).join('');
  $('swatches').querySelectorAll('.sw').forEach((b) => (b.onclick = () => { pick = b.dataset.c; renderSwatches(); }));
  $('mOrb').style.setProperty('--c', pick);
}
function openModal(a) {
  editing = a || null; pick = a?.color || COLORS[agents.length % COLORS.length];
  $('mTitle').textContent = a ? a.name : 'New agent';
  $('fName').value = a?.name || ''; $('fRole').value = a?.role || ''; $('fGroup').value = a?.group || ''; $('fPin').checked = a ? a.pinned : false;
  $('fSave').textContent = a ? 'Save' : 'Create'; $('fDel').style.display = a ? '' : 'none'; $('fErr').textContent = '';
  renderSwatches(); $('modal').classList.add('open'); if (!a) $('fName').focus();
}
$('newAgent').onclick = () => openModal();
$('fCancel').onclick = () => $('modal').classList.remove('open');
$('modal').onclick = (e) => { if (e.target === $('modal')) $('modal').classList.remove('open'); };
$('fDel').onclick = async () => {
  if (!editing || !confirm(`Delete ${editing.name} and its computer? Its files are kept on the server.`)) return;
  try { await api(`/agents/${editing.id}`, { method: 'DELETE' }); delete messages[editing.id]; current = null; $('modal').classList.remove('open'); await refresh(); if (current) select(current); }
  catch (e) { $('fErr').textContent = e.message; }
};
$('form').onsubmit = async (e) => {
  e.preventDefault(); $('fSave').disabled = true; $('fErr').textContent = editing ? '' : 'Setting up its computer…';
  const body = { name: $('fName').value, role: $('fRole').value || 'General assistant', group: $('fGroup').value, color: pick, pinned: $('fPin').checked };
  try {
    if (editing) await api(`/agents/${editing.id}`, { method: 'PATCH', body });
    else { const r = await api('/agents', { method: 'POST', body }); current = r.id; }
    $('modal').classList.remove('open'); await refresh(); select(current);
  } catch (err) { $('fErr').textContent = err.message; }
  $('fSave').disabled = false;
};
$('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  try { await api('/login', { method: 'POST', body: { password: $('pw').value } }); $('login').classList.remove('open'); start(); }
  catch { $('pwErr').textContent = 'Wrong password'; }
};
let started = false;
async function start() {
  try { await refresh(); if (!started) { started = true; connect(); setInterval(() => refresh().catch(() => {}), 15000); } if (current) select(current); } catch {}
}
start();
</script>
</body>
</html>
